apply plugin: 'com.android.application'

android {
    namespace = "com.fixxer.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.fixxer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv("MOBILE_VERSION_CODE") ?: "11").toInteger()
        versionName = System.getenv("MOBILE_VERSION_NAME") ?: "1.3.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inyectamos la API key de Google Maps para MOBILE en el manifest.
        // Es una key SEPARADA de la web (Maps SDK for Android, restringida
        // por package name + SHA-1). Orden de precedencia para la MOBILE:
        //   1. env var GOOGLE_MAPS_API_KEY_MOBILE   (lo recomendado)
        //   2. property GOOGLE_MAPS_API_KEY_MOBILE  (gradle.properties)
        //   3. fallback hardcoded (proyecto privado, clonar y compilar)
        def FALLBACK_MAPS_KEY = "AIzaSyBgqWClAVqHNOEXpNMCOEBYLf6btFPZugY"

        def mapsKey = (System.getenv("GOOGLE_MAPS_API_KEY_MOBILE") ?: "").trim()
        if (mapsKey.isEmpty()) {
            mapsKey = (project.findProperty("GOOGLE_MAPS_API_KEY_MOBILE") ?: "").toString().trim()
        }
        if (mapsKey.isEmpty()) {
            mapsKey = FALLBACK_MAPS_KEY
            logger.warn("[fixgo] Usando GOOGLE_MAPS_API_KEY_MOBILE hardcoded (fallback). Para overridear, define la env var o property.")
        }
        manifestPlaceholders = [
            mapsApiKey: mapsKey
        ]

        androidResources {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("ANDROID_KEYSTORE_FILE")
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
            def keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
            if (keystoreFile && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                this.keyAlias keyAlias
                this.keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 está habilitado para esta compilación de prueba interna.
            // Validar POST_NOTIFICATIONS en Android 13+ antes de promover a producción.
            minifyEnabled true
            // Mantener la reducción de recursos apagada hasta validar este release.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Genera native-debug-symbols.zip para diagnosticar crashes/ANR
            // en las librerías nativas incluidas por Capacitor y sus plugins.
            ndk {
                debugSymbolLevel 'FULL'
            }
            def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("ANDROID_KEYSTORE_FILE")
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
            def keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
            if (keystoreFile && keystorePassword && keyAlias && keyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        // Resolve Google/Android artifacts exclusively from the mirror because
        // this network cannot download their JARs from dl.google.com.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'AliyunGoogleMirror'
                    url = uri('https://maven.aliyun.com/repository/google')
                }
            }
            filter {
                includeGroupByRegex 'com\\.android(\\..*)?'
                includeGroupByRegex 'com\\.google\\.gms(\\..*)?'
                includeGroupByRegex 'com\\.google\\.firebase(\\..*)?'
                includeGroupByRegex 'com\\.google\\.android\\..+'
                includeGroupByRegex 'com\\.google\\.testing\\.platform(\\..*)?'
                includeGroupByRegex 'androidx\\..*'
            }
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

subprojects {
    // Capacitor plugins can request newer AndroidX versions transitively even
    // when rootProject.ext declares older ones. Keep the resolved graph within
    // the versions supported by AGP 8.8.2 + Gradle 8.11.
    configurations.configureEach {
        resolutionStrategy.force(
            'androidx.activity:activity:1.10.1',
            'androidx.activity:activity-ktx:1.10.1',
            'androidx.browser:browser:1.8.0',
            'androidx.core:core:1.16.0',
            'androidx.core:core-ktx:1.16.0',
            'com.google.firebase:firebase-messaging:24.1.0'
        )
    }

    if (name.startsWith('capacitor-') && name != 'capacitor-cordova-android-plugins') {
        // Capacitor 8 plugins declare AGP 8.13.0 inside their generated modules.
        // Keep them on AGP 8.8.2, compatible with the Gradle 8.11 wrapper,
        // without requiring changes inside node_modules.
        buildscript {
            repositories {
                exclusiveContent {
                    forRepository {
                        maven {
                            name = 'AliyunGoogleMirror'
                            url = uri('https://maven.aliyun.com/repository/google')
                        }
                    }
                    filter {
                        includeGroupByRegex 'com\\.android(\\..*)?'
                        includeGroupByRegex 'com\\.google\\.gms(\\..*)?'
                        includeGroupByRegex 'com\\.google\\.firebase(\\..*)?'
                        includeGroupByRegex 'com\\.google\\.android\\..+'
                        includeGroupByRegex 'com\\.google\\.testing\\.platform(\\..*)?'
                        includeGroupByRegex 'androidx\\..*'
                    }
                }
                mavenCentral()
                gradlePluginPortal()
            }
            configurations.configureEach {
                resolutionStrategy.force 'com.android.tools.build:gradle:8.8.2'
            }
        }
    }

    afterEvaluate {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:-deprecation"
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
